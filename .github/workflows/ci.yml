name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out the candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: false

      - name: Verify the lock and install frozen dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups
          git diff --exit-code -- pyproject.toml uv.lock

      - name: Run quality and test gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -p no:cacheprovider -q
          uv run python scripts/verify_notification_config.py

      - name: Build, scan, and compare packages
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          build_root="${RUNNER_TEMP}/smc-ict-packages"
          rm -rf "$build_root" .ci-venv .ci-requirements.txt
          mkdir -p "$build_root/one" "$build_root/two"
          export CI_BUILD_ROOT="$build_root"
          echo "CI_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH="$epoch" uv build --sdist --wheel --out-dir "$build_root/one"
          SOURCE_DATE_EPOCH="$epoch" uv build --sdist --wheel --out-dir "$build_root/two"
          uv run python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          builds = Path(os.environ["CI_BUILD_ROOT"])
          is_package = lambda path: path.suffix == ".whl" or path.name.endswith(".tar.gz")
          one = sorted(path for path in (builds / "one").iterdir() if is_package(path))
          two = sorted(path for path in (builds / "two").iterdir() if is_package(path))
          if len(one) != 2 or len(two) != 2:
              raise SystemExit("expected exactly one wheel and one source distribution per build")
          if [path.name for path in one] != [path.name for path in two]:
              raise SystemExit("package filename drift between deterministic builds")
          for first, second in zip(one, two, strict=True):
              if first.read_bytes() != second.read_bytes():
                  raise SystemExit(f"non-deterministic package: {first.name}")

          forbidden_parts = {
              ".env",
              ".git",
              ".mypy_cache",
              ".pytest_cache",
              ".ruff_cache",
              "__pycache__",
              "data",
              "reports",
              "secrets",
          }

          def reject_forbidden(names: list[str]) -> None:
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe package member: {name}")
                  if forbidden_parts.intersection(path.parts):
                      raise SystemExit(f"forbidden package member: {name}")
                  if path.suffix.lower() in {".key", ".pine", ".pyc", ".pyo", ".sqlite", ".db"}:
                      raise SystemExit(f"forbidden package member: {name}")

          wheel = next(path for path in one if path.suffix == ".whl")
          sdist = next(path for path in one if path.name.endswith(".tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_names = [member.name for member in archive.getmembers()]
          reject_forbidden(wheel_names)
          reject_forbidden(sdist_names)
          if len(wheel_names) != 51 or len(sdist_names) != 100:
              raise SystemExit(
                  f"package member boundary drift: wheel={len(wheel_names)} sdist={len(sdist_names)}"
              )
          if any(PurePosixPath(name).parts[0] not in {"smc_ict", "smc_ict_engine-0.1.0.dist-info"} for name in wheel_names):
              raise SystemExit("wheel contains a member outside the package boundary")
          for package in one:
              digest = hashlib.sha256(package.read_bytes()).hexdigest()
              print(f"{digest}  {package.name}")
          print(f"package members: wheel={len(wheel_names)} sdist={len(sdist_names)}")
          PY

      - name: Smoke-test a fresh wheel install from the lock
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file .ci-requirements.txt
          uv venv --python 3.13 .ci-venv
          uv pip install --python .ci-venv/bin/python --requirement .ci-requirements.txt
          uv pip install --python .ci-venv/bin/python --no-deps "$CI_BUILD_ROOT"/one/*.whl
          .ci-venv/bin/smc-ict --help >/dev/null

      - name: Build and smoke-test the exact container image
        run: |
          docker build \
            --build-arg "GIT_COMMIT=${GITHUB_SHA}" \
            --tag smc-ict-engine:ci \
            .
          test "$(docker image inspect smc-ict-engine:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect smc-ict-engine:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^SMC_ICT_GIT_COMMIT=//p')" = "${GITHUB_SHA}"
          docker run --rm --read-only --user 10001:10001 smc-ict-engine:ci --help >/dev/null
