x-runtime: &runtime
  build:
    context: .
  image: trading-research-engine:local
  pull_policy: never
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
  volumes:
    - type: bind
      source: ${DATA_FOLDER:?Set DATA_FOLDER to the writable host data directory}
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ./config
      target: /config
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./strategies
      target: /strategies
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./backtests
      target: /backtests
      read_only: true
      bind:
        create_host_path: false
services:
  engine:
    <<: *runtime
    secrets:
      - discord_webhook_url
    environment:
      CONFIG_FOLDER: /config
      DATA_FOLDER: /data
    command:
      - scheduler
      - --schedule
      - /config/schedule.yaml
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "trading-research", "scheduler-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  manual:
    <<: *runtime
    profiles: [manual]
    environment:
      CONFIG_FOLDER: /config
      DATA_FOLDER: /data
    command: ["--help"]

secrets:
  discord_webhook_url:
    file: ./secrets/discord_webhook_url