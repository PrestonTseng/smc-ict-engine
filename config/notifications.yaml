notifications:
  enabled: true
  destinations:
    discord_debug:
      adapter: discord_webhook
      enabled: true
      enabled_events: [run_started, run_succeeded, run_failed, decision_found, no_decision]
      endpoint:
        file: /run/secrets/discord_webhook_url
      timeout_seconds: 5
      retries:
        maximum_attempts: 3
        backoff_seconds: [1, 2]
      deduplication:
        window_seconds: 300
        key_fields: [event_type, run_id, instrument_id]
      batching:
        maximum_events: 10
        flush_seconds: 2
      redaction:
        headers: [authorization, cookie, set-cookie]
        query_parameters: [token, key, signature]
      failure_policy: warning
