[project]
name = "smc-ict-engine"
version = "0.1.0"
description = "Provider-neutral closed-candle SMC/ICT research engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "apscheduler==3.11.0",
  "ruamel-yaml==0.18.15",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.10",
]

[project.scripts]
smc-ict = "smc_ict.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/.env",
  "/.env.*",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/data",
  "/reports",
  "/secrets",
  "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smc_ict"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["smc_ict"]
